name: CI

# Q-T05: lint, pruebas, migraciones (up/down en base limpia), build y escaneo.
# Q-T12: cobertura con umbral en `test` + jobs de frontend (Flutter) y panel
# (admin-web); `ci-success` agrega todos los jobs.
# Cualquier error hace fallar el pipeline (sin `continue-on-error` en ningun job).
on:
  push:
    branches: [main, "feature/**", "sprint-*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: lint (ruff + black + secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias dev
        run: pip install -e "./backend[dev]"
      - name: Ruff
        run: ruff check backend
      - name: Black
        run: black --check backend
      - name: Chequeo de secretos
        run: bash infra/ci/secrets-check.sh

  test:
    name: pruebas (pytest + Postgres/Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banca
          POSTGRES_PASSWORD: banca
          POSTGRES_DB: banca_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banca -d banca_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://banca:banca@localhost:5432/banca_test
      TEST_DATABASE_URL: postgresql+psycopg://banca:banca@localhost:5432/banca_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias dev
        run: pip install -e "./backend[dev]"
      - name: Pytest con cobertura (umbral 80 %)
        working-directory: backend
        # Umbral justificado en Q-T12: medido 86 % (2026-10-11, 1484 passed);
        # umbral 80 = redondeo a la baja a multiplo de 5 con ~6 pp de margen.
        # Alcance `--cov=app` (= [tool.coverage.run] source; excluye tests/ y
        # migrations/). Sin `continue-on-error`: si la cobertura baja del
        # umbral o un test falla, pytest retorna != 0 y tiñe el job de rojo.
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80 -q

  migrations:
    name: migraciones (up/down en base limpia)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banca
          POSTGRES_PASSWORD: banca
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banca"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://banca:banca@localhost:5432/ci_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias dev
        run: pip install -e "./backend[dev]"
      - name: Validar migraciones up/down
        working-directory: backend
        run: bash ../infra/ci/check-migrations.sh

  build:
    name: build (imagenes Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/ci/Dockerfile.backend
          push: false
          tags: banca-backend:ci
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/ci/Dockerfile.worker
          push: false
          tags: banca-worker:ci

  scan:
    name: escaneo (dependencias + SAST + secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks compara before^..after del push; con un clon superficial
          # (depth=1) el commit base no existe y falla con "ambiguous argument".
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar backend + pip-audit
        run: |
          pip install -e "./backend[dev]"
          # Toolchain al dia antes de auditar (el runner puede traer un
          # setuptools con CVEs conocidos; se audita lo efectivamente instalado).
          pip install -U "setuptools>=83"
          pip install pip-audit
      - name: pip-audit (falla ante vulnerabilidades conocidas)
        run: pip-audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: npm audit admin-web (solo dependencias de produccion; falla ante high/critical)
        working-directory: admin-web
        # Audita las dependencias de produccion, que son las que se despliegan
        # (las criticas detectadas eran devDependencies). Sin `continue-on-error`:
        # con --audit-level=high, npm retorna != 0 ante vulnerabilidades altas o
        # criticas en produccion y tiñe el pipeline de rojo.
        run: npm audit --omit=dev --audit-level=high
      - name: Bandit SAST (falla ante HIGH severidad y HIGH confianza)
        # Umbral explicito: severidad HIGH + confianza HIGH. Sin `continue-on-error`:
        # cualquier hallazgo >= umbral retorna != 0 y tiñe el pipeline de rojo.
        run: bandit --severity-level high --confidence-level high -r backend/app
      - name: Gitleaks (falla ante secretos en el historial)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: frontend (flutter analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pin verificado en local (Q-T12): Flutter 3.47.1 / Dart 3.13.1,
          # compatible con `sdk ^3.13.1` de frontend/pubspec.yaml.
          flutter-version: "3.47.1"
          channel: stable
          cache: true
      - name: Dependencias (pubspec.lock, reproducible)
        working-directory: frontend
        run: flutter pub get
      - name: Analyze (falla ante cualquier issue)
        working-directory: frontend
        # Sin `continue-on-error`: cualquier issue retorna != 0 y tiñe el job.
        run: flutter analyze
      - name: Test
        working-directory: frontend
        run: flutter test

  panel:
    name: panel admin-web (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Paridad con el entorno verificado en local (Q-T12): Node 22.
          node-version: "22"
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - name: Instalar dependencias (lockfile, reproducible)
        working-directory: admin-web
        run: npm ci
      - name: Lint (tsc --noEmit)
        working-directory: admin-web
        run: npm run lint
      - name: Test (vitest run)
        working-directory: admin-web
        run: npm test
      - name: Build (tsc + vite build)
        working-directory: admin-web
        run: npm run build

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [lint, test, migrations, build, scan, frontend, panel]
    if: always()
    steps:
      - name: Verificar que todo estuvo verde
        run: |
          python3 - <<'EOF'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {k: v for k, v in needs.items() if v["result"] != "success"}
          if failed:
              raise SystemExit(f"CI rojo: {failed}")
          print("CI verde: lint, test, migrations, build, scan, frontend y panel en success.")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
