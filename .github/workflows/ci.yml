name: CI

# Q-T05: lint, pruebas, migraciones (up/down en base limpia), build y escaneo.
# Cualquier error hace fallar el pipeline (sin `continue-on-error` en ningun job).
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: lint (ruff + black + secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias dev
        run: pip install -e "./backend[dev]"
      - name: Ruff
        run: ruff check backend
      - name: Black
        run: black --check backend
      - name: Chequeo de secretos
        run: bash infra/ci/secrets-check.sh

  test:
    name: pruebas (pytest + Postgres/Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banca
          POSTGRES_PASSWORD: banca
          POSTGRES_DB: banca_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banca -d banca_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://banca:banca@localhost:5432/banca_test
      TEST_DATABASE_URL: postgresql+psycopg://banca:banca@localhost:5432/banca_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias dev
        run: pip install -e "./backend[dev]"
      - name: Pytest
        # Sin BD las pruebas de integracion hacen skip; con el servicio
        # Postgres levantado deben correr de verdad. Un test fallido
        # retorna codigo != 0 y tiñe el pipeline de rojo.
        run: pytest backend/tests -v

  migrations:
    name: migraciones (up/down en base limpia)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: banca
          POSTGRES_PASSWORD: banca
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banca"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://banca:banca@localhost:5432/ci_migrations
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias dev
        run: pip install -e "./backend[dev]"
      - name: Validar migraciones up/down
        working-directory: backend
        run: bash ../infra/ci/check-migrations.sh

  build:
    name: build (imagenes Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/ci/Dockerfile.backend
          push: false
          tags: banca-backend:ci
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/ci/Dockerfile.worker
          push: false
          tags: banca-worker:ci

  scan:
    name: escaneo (dependencias + secretos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar backend + pip-audit
        run: |
          pip install -e "./backend[dev]"
          # Toolchain al dia antes de auditar (el runner puede traer un
          # setuptools con CVEs conocidos; se audita lo efectivamente instalado).
          pip install -U "setuptools>=83"
          pip install pip-audit
      - name: pip-audit (falla ante vulnerabilidades conocidas)
        run: pip-audit
      - name: Gitleaks (falla ante secretos en el historial)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-success:
    name: ci-success
    runs-on: ubuntu-latest
    needs: [lint, test, migrations, build, scan]
    if: always()
    steps:
      - name: Verificar que todo estuvo verde
        run: |
          python3 - <<'EOF'
          import json, os
          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = {k: v for k, v in needs.items() if v["result"] != "success"}
          if failed:
              raise SystemExit(f"CI rojo: {failed}")
          print("CI verde: lint, test, migrations, build y scan en success.")
          EOF
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
