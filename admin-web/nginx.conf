# admin-web (E3-T10): SPA estática del panel + proxy opcional al backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: toda ruta no-archivo cae a index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Activos con hash: caché larga.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
