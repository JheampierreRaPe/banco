# admin-web (E3-T10): SPA estática del panel + proxy opcional al backend.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Resolver DNS interno de Docker. Con el upstream en variable, nginx
  # re-resuelve `backend` cada `valid` y no cachea la IP al arrancar.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend_upstream "backend:8000";

  # Same-origin API: el navegador pega al mismo host del panel
  # (`/api/...`) y nginx proxea al servicio `backend` de compose.
  # Preserva la ruta y reenvía cabeceras. Debe ir antes del fallback SPA.
  location /api/ {
    proxy_pass http://$backend_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: toda ruta no-archivo cae a index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Activos con hash: caché larga.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
