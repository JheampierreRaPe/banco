name: banca-demo

# Entorno de demo (Q-T06). Un solo comando levanta todo:
#   docker compose up --build -d
# Variables desde .env (plantilla .env.example). Sin secretos en el repo.

x-database-url: &database-url
  postgresql+psycopg://${POSTGRES_USER:-banca}:${POSTGRES_PASSWORD:-banca}@postgres:5432/${POSTGRES_DB:-banca}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-banca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-banca}
      POSTGRES_DB: ${POSTGRES_DB:-banca}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      APP_NAME: Banca Online Integral
      APP_ENV: demo
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      KYC_PROVIDER: ${KYC_PROVIDER:-mock}
      KYC_BASE_URL: ${KYC_BASE_URL:-http://kyc:8000}
      KYC_API_KEY: ${KYC_API_KEY:-change-me}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      APP_ENV: demo
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379/0
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-8100}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.getenv('WORKER_HEALTH_PORT', '8100') + '/health', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin-web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.panel
    restart: unless-stopped
    ports:
      - "${ADMIN_WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# kyc-service (opcional): activar con `docker compose --profile kyc up -d`
  # y apuntar KYC_BASE_URL=http://kyc:8000 en .env. Imagen segun el adaptador
  # desplegado o el simulador definido en su propia tarea.
  # kyc-service:
  #   image: ${KYC_IMAGE:-kyc-service:dev}
  #   profiles: ["kyc"]
